# Global benchmark (D-35): how CSIR-NCL, CSIR-IICT and CSIR-CECRI compare with similar
# institutes in India, the USA, China, South Korea and Australia, and how they are linked.
# Every rule below is applied by src/collect/22_global_peers.py and shown on dashboard/global.html.

years: {start: 2016, end: 2025}   # 2026 is partial (collected Oct 2026), so it is left out
work_types: [article, review]     # research papers only, for every institution alike

# Benchmark scope: the research subfields that together make up this share of the three labs'
# papers. Every institution is measured only on papers in these subfields, so a university's
# civil engineering or medicine does not count against or for it.
scope_coverage: 0.90

countries:
  US: USA
  CN: China
  KR: South Korea
  AU: Australia

# Candidate pool per country (rules 1-3), then peer choice (rule 4).
candidates:
  top_n_by_output: 200          # rule 1: the country's 200 institutions with the most in-scope papers
  keep_types: [government, facility]   # rule 2: government research institutes, like CSIR (no universities, companies, hospitals)
  # rule 2b: hand-reviewed exclusions with reasons in config/overrides/global_peer_exclusions.csv
  min_size_ratio: 0.5           # rule 3: at least half the in-scope papers of our smallest lab
  max_candidates: 25            # most productive candidates kept per country for the similarity test
peers_per_country: 3            # rule 4: one "twin" per CSIR lab, by research-profile similarity
min_similarity: 0.4             # rule 4: a weaker match is not a twin (the lab then has none in that country)

# Indian reference group (chosen with the team, not by the rules above: leading Indian chemistry
# universities and institutes; measured on the same scope).
indian_peers:
  - {id: I59270414,  short: IISc}
  - {id: I181996519, short: IISER Pune}
  - {id: I162827531, short: IIT Bombay}
  - {id: I24676775,  short: IIT Madras}
  - {id: I167751958, short: ICT Mumbai}
  - {id: I165998391, short: IACS Kolkata}

# Display labels for the peers the rules selected (labels only; selection is in data/final/global/peers.csv)
short_names:
  I1289243028: ORNL
  I1297288678: NLR (ex-NREL)
  I180585399: DICP
  I4210119098: FJIRSM
  I4210112946: SIOC
  I4210104335: IBS
  I4210151417: KRICT
  I4210127102: KIER
  I4210154771: CSIRO Manufacturing
  I1334950195: ANSTO
