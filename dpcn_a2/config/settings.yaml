years:
  start: 2016
  end: 2026

collection_date: "2026-10-13"

openalex:
  per_page: 100
  corpus: core
  max_spend_usd_per_run: 0.80
  max_rps: 20
  concurrency: 8

roster:
  min_delay_s: 1.0
  respect_robots: true

matching:
  fuzzy_threshold_auto: 92
  fuzzy_threshold_review: 85

former_faculty_heuristic:
  min_papers: 10
  min_distinct_years: 3

stats:
  hist_bin_width: 5
  partial_year_note: "2026 is partial (data to 13 Oct 2026)"

# Citation impact ratio (IR) = citations received / citations made (references), per paper.
# A paper is "IR-Q1" when IR > threshold. The threshold is the quartile_percentile of IR over
# all papers (75th -> top 25% of papers, the same share as a quartile). Fixed thresholds can be
# added under `thresholds` (e.g. [5, 10]); they were dropped because they select < 1% of papers.
impact_ratio:
  thresholds: []
  quartile_percentile: 75
